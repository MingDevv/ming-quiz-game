<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midterm Survival ม.4 เทอม 1</title>
<meta name="description" content="เว็บติวสอบกลางภาค ม.4 เทอม 1 ครบ 6 วิชา 165 ข้อ พร้อมเฉลยละเอียด">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Sarabun','Inter','sans-serif'],display:['Inter','sans-serif']},animation:{fadeIn:'fadeIn .4s ease-out',slideUp:'slideUp .4s ease-out',pop:'pop .3s ease-out',shake:'shake .4s ease-out',modalIn:'modalIn .3s ease-out'},keyframes:{fadeIn:{from:{opacity:0},to:{opacity:1}},slideUp:{from:{opacity:0,transform:'translateY(20px)'},to:{opacity:1,transform:'translateY(0)'}},pop:{'0%':{transform:'scale(.85)',opacity:0},'60%':{transform:'scale(1.03)'},'100%':{transform:'scale(1)',opacity:1}},shake:{'0%,100%':{transform:'translateX(0)'},'25%':{transform:'translateX(-6px)'},'75%':{transform:'translateX(6px)'}},modalIn:{from:{opacity:0,transform:'scale(.92) translateY(16px)'},to:{opacity:1,transform:'scale(1) translateY(0)'}}}}}}
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Sarabun','Inter',sans-serif;margin:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:9px}
.dark ::-webkit-scrollbar-thumb{background:#475569}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dark .glass{background:rgba(30,41,59,.72)}
.dot-bg{background-image:radial-gradient(circle,rgba(0,0,0,.05) 1px,transparent 1px);background-size:20px 20px}
.dark .dot-bg{background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px)}
.card-hover{transition:all .25s cubic-bezier(.4,0,.2,1)}.card-hover:hover{transform:translateY(-5px) scale(1.01)}
.opt-btn{transition:all .2s ease}.opt-btn:hover:not(:disabled){transform:translateX(3px)}
.progress-bar{transition:width .5s cubic-bezier(.4,0,.2,1)}
@keyframes confettiDrop{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
.confetti{position:fixed;pointer-events:none;animation:confettiDrop 2.5s ease-in forwards}
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">
<div id="root"></div>
<script src="data/math.js"></script>
<script src="data/thai.js"></script>
<script src="data/english.js"></script>
<script src="data/biology.js"></script>
<script src="data/chemistry.js"></script>
<script src="data/physics.js"></script>
<script src="data/cheatsheets.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo,createContext,useContext}=React;

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const SUBJECTS=[
  {id:'math',name:'คณิตศาสตร์',icon:'📐',color:'rose',desc:'เซต สับเซต เพาเวอร์เซต การดำเนินการเซต โจทย์ปัญหาเซต',total:20},
  {id:'thai',name:'ภาษาไทย',icon:'📝',color:'blue',desc:'ภาษาและการสื่อสาร การอ่านอย่างมีประสิทธิภาพ คำและกลุ่มคำ',total:30},
  {id:'english',name:'ภาษาอังกฤษ',icon:'🌍',color:'violet',desc:'Grammar · Vocabulary · Reading Comprehension',total:30},
  {id:'biology',name:'ชีววิทยา',icon:'🧬',color:'emerald',desc:'สิ่งมีชีวิต สารชีวโมเลกุล เอนไซม์ เมแทบอลิซึม',total:30},
  {id:'chemistry',name:'เคมี',icon:'⚗️',color:'teal',desc:'แบบจำลองอะตอม ตารางธาตุ สมบัติธาตุ กัมมันตรังสี',total:35},
  {id:'physics',name:'ฟิสิกส์',icon:'⚡',color:'amber',desc:'การวัด เลขนัยสำคัญ การเคลื่อนที่แนวตรง สมการจลศาสตร์',total:20},
];
const COLOR_MAP={
  rose:{bg:'bg-rose-500',light:'bg-rose-50 dark:bg-rose-950/30',border:'border-rose-300 dark:border-rose-700',text:'text-rose-600 dark:text-rose-400',ring:'ring-rose-400',grad:'from-rose-400 to-pink-500'},
  blue:{bg:'bg-blue-500',light:'bg-blue-50 dark:bg-blue-950/30',border:'border-blue-300 dark:border-blue-700',text:'text-blue-600 dark:text-blue-400',ring:'ring-blue-400',grad:'from-blue-400 to-cyan-500'},
  violet:{bg:'bg-violet-500',light:'bg-violet-50 dark:bg-violet-950/30',border:'border-violet-300 dark:border-violet-700',text:'text-violet-600 dark:text-violet-400',ring:'ring-violet-400',grad:'from-violet-400 to-purple-500'},
  emerald:{bg:'bg-emerald-500',light:'bg-emerald-50 dark:bg-emerald-950/30',border:'border-emerald-300 dark:border-emerald-700',text:'text-emerald-600 dark:text-emerald-400',ring:'ring-emerald-400',grad:'from-emerald-400 to-green-500'},
  teal:{bg:'bg-teal-500',light:'bg-teal-50 dark:bg-teal-950/30',border:'border-teal-300 dark:border-teal-700',text:'text-teal-600 dark:text-teal-400',ring:'ring-teal-400',grad:'from-teal-400 to-cyan-500'},
  amber:{bg:'bg-amber-500',light:'bg-amber-50 dark:bg-amber-950/30',border:'border-amber-300 dark:border-amber-700',text:'text-amber-600 dark:text-amber-400',ring:'ring-amber-400',grad:'from-amber-400 to-orange-500'},
};

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function useLS(key,init){const[v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):init;}catch{return init;}});useEffect(()=>{localStorage.setItem(key,JSON.stringify(v));},[key,v]);return[v,setV];}
function getQuestions(id){const m={math:window.MATH_QUESTIONS,thai:window.THAI_QUESTIONS,english:window.ENGLISH_QUESTIONS,biology:window.BIOLOGY_QUESTIONS,chemistry:window.CHEMISTRY_QUESTIONS,physics:window.PHYSICS_QUESTIONS};return m[id]||[];}
function getCheatSheet(id){return(window.CHEATSHEETS||{})[id]||null;}
function fmtTime(s){const m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`;}
function prepareQuiz(questions,count){
  const picked=shuffle(questions).slice(0,count);
  return picked.map(q=>{
    const idx=[0,1,2,3];const si=shuffle(idx);
    return{...q,displayChoices:si.map(i=>q.choices[i]),correctIndex:si.indexOf(q.answer),originalAnswer:q.answer};
  });
}

// ═══════════════════════════════════════════
// CONTEXT
// ═══════════════════════════════════════════
const Ctx=createContext();
function Provider({children}){
  const[dark,setDark]=useLS('ms-dark',false);
  const[history,setHistory]=useLS('ms-history',[]);
  const[bookmarks,setBM]=useLS('ms-bookmarks',[]);
  const[page,setPage]=useState({name:'home',param:null});
  const[quizData,setQuizData]=useState(null);
  const[result,setResult]=useState(null);
  useEffect(()=>{document.documentElement.classList.toggle('dark',dark);},[dark]);
  const navigate=(name,param=null)=>setPage({name,param});
  const toggleBM=id=>setBM(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const addHistory=r=>setHistory(p=>[r,...p].slice(0,50));
  const clearData=()=>{setHistory([]);setBM([]);localStorage.removeItem('ms-history');localStorage.removeItem('ms-bookmarks');};
  const val={dark,setDark:()=>setDark(d=>!d),history,addHistory,bookmarks,toggleBM,page,navigate,quizData,setQuizData,result,setResult,clearData};
  return <Ctx.Provider value={val}>{children}</Ctx.Provider>;
}
function useApp(){return useContext(Ctx);}

// ═══════════════════════════════════════════
// SMALL COMPONENTS
// ═══════════════════════════════════════════
function Navbar(){
  const{dark,setDark,navigate,page}=useApp();
  const links=[['home','🏠','หน้าหลัก'],['dashboard','📊','แดชบอร์ด'],['settings','⚙️','ตั้งค่า']];
  return(
    <nav className="sticky top-0 z-50 glass border-b border-gray-200/50 dark:border-gray-700/50">
      <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
        <button onClick={()=>navigate('home')} className="flex items-center gap-2 font-display font-extrabold text-lg">
          <span className="text-2xl">🎯</span>
          <span className="bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent hidden sm:inline">Midterm Survival</span>
        </button>
        <div className="flex items-center gap-1">
          {links.map(([n,ic,lb])=>(
            <button key={n} onClick={()=>navigate(n)} title={lb}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${page.name===n?'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400':'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500'}`}>
              <span className="sm:hidden text-lg">{ic}</span><span className="hidden sm:inline">{lb}</span>
            </button>
          ))}
          <button onClick={setDark} className="ml-2 w-9 h-9 rounded-full flex items-center justify-center bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-lg" title="สลับธีม">
            {dark?'☀️':'🌙'}
          </button>
        </div>
      </div>
    </nav>
  );
}

function PBar({value,max,color='indigo'}){
  const pct=max?Math.round(value/max*100):0;
  return(
    <div className="w-full">
      <div className="flex justify-between text-xs font-medium text-gray-400 mb-1"><span>{value}/{max}</span><span>{pct}%</span></div>
      <div className="h-2.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
        <div className={`h-full rounded-full progress-bar bg-${color}-500`} style={{width:pct+'%'}}/>
      </div>
    </div>
  );
}

function Modal({show,onClose,children,wide}){
  if(!show)return null;
  return(
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" style={{background:'rgba(0,0,0,.45)',backdropFilter:'blur(4px)'}}>
      <div className={`animate-modalIn bg-white dark:bg-gray-900 rounded-2xl shadow-2xl ${wide?'max-w-2xl':'max-w-lg'} w-full max-h-[85vh] overflow-y-auto border border-gray-200 dark:border-gray-700`}>
        {children}
        <div className="p-4 pt-0"><button onClick={onClose} className="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold hover:shadow-lg transition-all active:scale-95">ปิด</button></div>
      </div>
    </div>
  );
}

function Timer({startTime}){
  const[elapsed,setElapsed]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setElapsed(Math.floor((Date.now()-startTime)/1000)),1000);return()=>clearInterval(t);},[startTime]);
  return <span className="font-mono font-bold text-lg">{fmtTime(elapsed)}</span>;
}

function Confetti({show}){
  if(!show)return null;
  const cols=['#f43f5e','#3b82f6','#8b5cf6','#22c55e','#f59e0b','#14b8a6','#ec4899','#fbbf24'];
  return <>{Array.from({length:30},(_,i)=><div key={i} className="confetti" style={{left:Math.random()*100+'vw',top:'-10px',width:Math.random()*8+4+'px',height:Math.random()*8+4+'px',background:cols[i%cols.length],borderRadius:Math.random()>.5?'50%':'2px',animationDelay:Math.random()*.8+'s',animationDuration:Math.random()*1.5+2+'s'}}/>)}</>;
}

function SubjectCard({s,progress}){
  const{navigate}=useApp();
  const c=COLOR_MAP[s.color];
  const qs=getQuestions(s.id);
  const done=progress?.attempts||0;
  const best=progress?.best||0;
  return(
    <button onClick={()=>navigate('subject',s.id)} className={`card-hover text-left p-5 rounded-2xl border-2 ${c.border} ${c.light} shadow-sm hover:shadow-xl transition-all group`}>
      <div className="text-3xl mb-2 group-hover:scale-110 transition-transform inline-block">{s.icon}</div>
      <h3 className={`text-lg font-bold ${c.text} mb-1`}>{s.name}</h3>
      <p className="text-xs text-gray-400 dark:text-gray-500 mb-3 leading-relaxed line-clamp-2">{s.desc}</p>
      <div className="flex items-center justify-between text-xs text-gray-400">
        <span>{qs.length>0?`${qs.length} ข้อ`:'เร็วๆ นี้'}</span>
        {done>0&&<span className={c.text}>ทำ {done} ครั้ง · สูงสุด {best}%</span>}
      </div>
      {qs.length>0&&<div className="mt-2 h-1.5 bg-white/50 dark:bg-gray-800/50 rounded-full overflow-hidden">
        <div className={`h-full rounded-full bg-gradient-to-r ${c.grad}`} style={{width:(best||0)+'%'}}/>
      </div>}
    </button>
  );
}

// ═══════════════════════════════════════════
// HOME PAGE
// ═══════════════════════════════════════════
function HomePage(){
  const{history}=useApp();
  const totalDone=history.length;
  const avgScore=totalDone?Math.round(history.reduce((a,h)=>a+h.pct,0)/totalDone):0;
  const progress={};
  history.forEach(h=>{
    if(!progress[h.subjectId])progress[h.subjectId]={attempts:0,best:0};
    progress[h.subjectId].attempts++;
    progress[h.subjectId].best=Math.max(progress[h.subjectId].best,h.pct);
  });
  return(
    <div className="animate-fadeIn">
      <div className="relative overflow-hidden">
        <div className="absolute inset-0 bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 dark:from-indigo-950/50 dark:via-purple-950/30 dark:to-pink-950/30 opacity-80"/>
        <div className="relative max-w-6xl mx-auto px-4 py-12 sm:py-20 text-center">
          <div className="animate-slideUp">
            <span className="inline-block mb-3 px-3 py-1 rounded-full bg-amber-200/80 dark:bg-amber-800/40 text-amber-800 dark:text-amber-300 text-xs font-bold">🔥 เตรียมสอบ Midterm 2568</span>
            <h1 className="font-display text-4xl sm:text-6xl font-black bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent mb-3 leading-tight">Midterm Survival</h1>
            <p className="font-display text-xl sm:text-2xl font-semibold text-gray-500 dark:text-gray-400 mb-2">ม.4 เทอม 1</p>
            <p className="text-gray-400 dark:text-gray-500 text-sm max-w-md mx-auto">ติวสอบกลางภาค 6 วิชา 165 ข้อ พร้อมเฉลยละเอียด สรุปสูตร และวิเคราะห์จุดอ่อน</p>
          </div>
        </div>
      </div>
      <div className="max-w-6xl mx-auto px-4 -mt-4 mb-8">
        <div className="glass rounded-2xl shadow-lg p-4 flex flex-wrap justify-center gap-6 sm:gap-10 text-center border border-white/40 dark:border-gray-700/40">
          <div><div className="text-2xl font-black font-display text-indigo-600 dark:text-indigo-400">165</div><div className="text-xs text-gray-400">ข้อสอบ</div></div>
          <div className="w-px bg-gray-200 dark:bg-gray-700"/>
          <div><div className="text-2xl font-black font-display text-purple-600 dark:text-purple-400">6</div><div className="text-xs text-gray-400">วิชา</div></div>
          <div className="w-px bg-gray-200 dark:bg-gray-700"/>
          <div><div className="text-2xl font-black font-display text-pink-600 dark:text-pink-400">{totalDone}</div><div className="text-xs text-gray-400">ทำแล้ว</div></div>
          <div className="w-px bg-gray-200 dark:bg-gray-700"/>
          <div><div className="text-2xl font-black font-display text-emerald-600 dark:text-emerald-400">{avgScore}%</div><div className="text-xs text-gray-400">เฉลี่ย</div></div>
        </div>
      </div>
      <div className="max-w-6xl mx-auto px-4 pb-16">
        <h2 className="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 flex items-center gap-2">📋 เลือกวิชาที่ต้องการฝึก</h2>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {SUBJECTS.map(s=><SubjectCard key={s.id} s={s} progress={progress[s.id]}/>)}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
// DASHBOARD PAGE
// ═══════════════════════════════════════════
function DashboardPage(){
  const{history,navigate}=useApp();
  const chartRef=useRef(null);
  const chartInst=useRef(null);
  const progress={};
  SUBJECTS.forEach(s=>{progress[s.id]={attempts:0,best:0,total:0,correct:0};});
  history.forEach(h=>{
    if(progress[h.subjectId]){progress[h.subjectId].attempts++;progress[h.subjectId].best=Math.max(progress[h.subjectId].best,h.pct);progress[h.subjectId].total+=h.total;progress[h.subjectId].correct+=h.score;}
  });
  useEffect(()=>{
    if(!chartRef.current)return;
    if(chartInst.current)chartInst.current.destroy();
    const isDark=document.documentElement.classList.contains('dark');
    chartInst.current=new Chart(chartRef.current,{
      type:'radar',
      data:{
        labels:SUBJECTS.map(s=>s.name),
        datasets:[{label:'คะแนนสูงสุด (%)',data:SUBJECTS.map(s=>progress[s.id].best),
          backgroundColor:isDark?'rgba(129,140,248,.2)':'rgba(99,102,241,.15)',
          borderColor:isDark?'#818cf8':'#6366f1',borderWidth:2,pointBackgroundColor:isDark?'#818cf8':'#6366f1'}]
      },
      options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:20,color:isDark?'#94a3b8':'#64748b',backdropColor:'transparent'},grid:{color:isDark?'rgba(148,163,184,.15)':'rgba(0,0,0,.08)'},pointLabels:{color:isDark?'#cbd5e1':'#334155',font:{size:11,family:'Sarabun'}}}},plugins:{legend:{display:false}}}
    });
    return()=>{if(chartInst.current)chartInst.current.destroy();};
  },[history]);
  const achievements=[
    {icon:'🌟',title:'เริ่มต้น',desc:'ทำข้อสอบครั้งแรก',earned:history.length>=1},
    {icon:'🔥',title:'ขยัน',desc:'ทำข้อสอบ 5 ครั้ง',earned:history.length>=5},
    {icon:'💯',title:'Perfect',desc:'ได้คะแนนเต็ม',earned:history.some(h=>h.pct===100)},
    {icon:'📚',title:'ครบวิชา',desc:'ทำครบทุกวิชา',earned:SUBJECTS.every(s=>progress[s.id].attempts>0)},
    {icon:'🏆',title:'เก่งมาก',desc:'ได้ 80%+ ทุกวิชา',earned:SUBJECTS.every(s=>progress[s.id].best>=80)},
    {icon:'⚡',title:'Speed Run',desc:'ทำข้อสอบ 10 ครั้ง',earned:history.length>=10},
  ];
  return(
    <div className="animate-fadeIn max-w-6xl mx-auto px-4 py-6">
      <h1 className="font-display text-2xl font-bold mb-6 flex items-center gap-2">📊 แดชบอร์ด</h1>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-800">
          <h3 className="font-bold text-gray-500 dark:text-gray-400 text-sm mb-4">📈 ความคืบหน้าแต่ละวิชา</h3>
          {SUBJECTS.map(s=>{const p=progress[s.id];return(
            <div key={s.id} className="mb-3 last:mb-0">
              <div className="flex items-center gap-2 mb-1">
                <span className="text-sm">{s.icon}</span>
                <span className="text-sm font-medium flex-1">{s.name}</span>
                <span className="text-xs text-gray-400">{p.attempts} ครั้ง</span>
              </div>
              <PBar value={p.best} max={100} color={s.color}/>
            </div>
          );})}
        </div>
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-800">
          <h3 className="font-bold text-gray-500 dark:text-gray-400 text-sm mb-4">🎯 Radar Chart</h3>
          <div className="h-64"><canvas ref={chartRef}/></div>
        </div>
      </div>
      <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-800 mb-8">
        <h3 className="font-bold text-gray-500 dark:text-gray-400 text-sm mb-4">🏅 Achievement</h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          {achievements.map((a,i)=>(
            <div key={i} className={`text-center p-3 rounded-xl border ${a.earned?'bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-700':'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 opacity-40'}`}>
              <div className="text-2xl mb-1">{a.icon}</div>
              <div className="text-xs font-bold">{a.title}</div>
              <div className="text-[10px] text-gray-400">{a.desc}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-800">
        <h3 className="font-bold text-gray-500 dark:text-gray-400 text-sm mb-4">📜 ประวัติการทำข้อสอบ ({history.length})</h3>
        {history.length===0?<p className="text-gray-400 text-sm text-center py-8">ยังไม่มีประวัติ ลองทำข้อสอบดูสิ!</p>:
        <div className="space-y-2 max-h-80 overflow-y-auto">
          {history.map((h,i)=>{const s=SUBJECTS.find(x=>x.id===h.subjectId);return(
            <div key={i} className="flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 text-sm">
              <span className="text-xl">{s?.icon}</span>
              <div className="flex-1">
                <span className="font-medium">{s?.name}</span>
                <span className="text-gray-400 text-xs ml-2">{new Date(h.date).toLocaleDateString('th-TH')}</span>
              </div>
              <span className={`font-bold ${h.pct>=80?'text-emerald-500':h.pct>=60?'text-amber-500':'text-rose-500'}`}>{h.score}/{h.total} ({h.pct}%)</span>
              <span className="text-gray-400 text-xs">{fmtTime(h.time)}</span>
            </div>
          );})}
        </div>}
      </div>
    </div>
  );
}

// SUBJECT PAGE
// ═══════════════════════════════════════════
function SubjectPage(){
  const{page,navigate,setQuizData}=useApp();
  const sid=page.param;
  const s=SUBJECTS.find(x=>x.id===sid);
  const qs=getQuestions(sid);
  const[count,setCount]=useState(10);
  const c=s?COLOR_MAP[s.color]:COLOR_MAP.rose;
  if(!s)return <div className="max-w-6xl mx-auto px-4 py-20 text-center text-gray-400">ไม่พบวิชานี้</div>;
  const startQuiz=()=>{
    if(qs.length===0)return;
    const prepared=prepareQuiz(qs,Math.min(count,qs.length));
    setQuizData({subjectId:sid,questions:prepared,answers:new Array(prepared.length).fill(null),bookmarks:[],startTime:Date.now()});
    navigate('quiz',sid);
  };
  const counts=[10,20,30,qs.length>30?qs.length:null].filter(Boolean).filter(x=>x<=qs.length);
  if(counts.length===0&&qs.length>0)counts.push(qs.length);
  return(
    <div className="animate-fadeIn max-w-3xl mx-auto px-4 py-8">
      <button onClick={()=>navigate('home')} className="text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 mb-4 inline-block">← กลับหน้าหลัก</button>
      <div className={`rounded-2xl ${c.light} border-2 ${c.border} p-6 mb-6`}>
        <div className="text-4xl mb-3">{s.icon}</div>
        <h1 className={`text-2xl font-bold ${c.text} mb-2`}>{s.name}</h1>
        <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">{s.desc}</p>
        <div className="flex items-center gap-4 text-sm text-gray-400">
          <span>📄 {qs.length} ข้อ</span>
          <span>⏱ ~{Math.ceil(qs.length*1.5)} นาที</span>
        </div>
      </div>
      {qs.length===0?(
        <div className="text-center py-12 text-gray-400">
          <div className="text-4xl mb-3">🚧</div>
          <p className="font-medium">กำลังเตรียมข้อสอบ...</p>
          <p className="text-sm">ข้อสอบวิชานี้จะพร้อมเร็วๆ นี้</p>
        </div>
      ):(
        <>
          <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-800 mb-4">
            <h3 className="font-bold text-sm text-gray-500 mb-3">🎯 เลือกจำนวนข้อ</h3>
            <div className="flex flex-wrap gap-2 mb-4">
              {counts.map(n=>(
                <button key={n} onClick={()=>setCount(n)} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all ${count===n?`bg-gradient-to-r ${c.grad} text-white shadow-md`:'bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700'}`}>
                  {n===qs.length?`ทั้งหมด (${n})`:n+' ข้อ'}
                </button>
              ))}
            </div>
            <button onClick={startQuiz} className={`w-full py-3 rounded-xl bg-gradient-to-r ${c.grad} text-white font-bold text-lg hover:shadow-xl transition-all active:scale-95`}>
              🚀 เริ่มทำข้อสอบ
            </button>
          </div>
          <button onClick={()=>navigate('cheatsheet',sid)} className="w-full py-3 rounded-xl bg-white dark:bg-gray-900 border-2 border-dashed border-gray-300 dark:border-gray-700 text-gray-500 font-medium hover:border-indigo-400 hover:text-indigo-500 transition-all">
            📖 ดู Cheat Sheet / สรุปสูตร
          </button>
        </>
      )}
    </div>
  );
}

// QUIZ PAGE
// ═══════════════════════════════════════════
function QuizPage(){
  const{quizData,setQuizData,navigate,setResult,addHistory}=useApp();
  const[idx,setIdx]=useState(0);
  const[showExplain,setShowExplain]=useState(false);
  if(!quizData)return <div className="max-w-6xl mx-auto px-4 py-20 text-center"><p className="text-gray-400">ไม่มีข้อมูลข้อสอบ</p><button onClick={()=>navigate('home')} className="mt-4 text-indigo-500">กลับหน้าหลัก</button></div>;
  const{questions,answers,bookmarks,startTime,subjectId}=quizData;
  const q=questions[idx];
  const s=SUBJECTS.find(x=>x.id===subjectId);
  const c=s?COLOR_MAP[s.color]:COLOR_MAP.rose;
  const answered=answers[idx]!==null;
  const isCorrect=answered&&answers[idx]===q.correctIndex;
  const selectAnswer=(ci)=>{
    if(answered)return;
    const newAns=[...answers];newAns[idx]=ci;
    setQuizData({...quizData,answers:newAns});
  };
  const toggleBM=()=>{
    const bm=bookmarks.includes(idx)?bookmarks.filter(x=>x!==idx):[...bookmarks,idx];
    setQuizData({...quizData,bookmarks:bm});
  };
  const goNext=()=>{setShowExplain(false);if(idx<questions.length-1)setIdx(idx+1);};
  const goPrev=()=>{setShowExplain(false);if(idx>0)setIdx(idx-1);};
  const submit=()=>{
    const time=Math.floor((Date.now()-startTime)/1000);
    let score=0;const details=questions.map((q,i)=>{
      const correct=answers[i]===q.correctIndex;if(correct)score++;
      return{question:q.question,topic:q.topic,userAnswer:answers[i],correctAnswer:q.correctIndex,correct,choices:q.displayChoices,explanation:q.explanation,solution:q.solution,formula:q.formula};
    });
    const pct=Math.round(score/questions.length*100);
    const res={subjectId,score,total:questions.length,pct,time,date:Date.now(),details};
    setResult(res);addHistory({subjectId,score,total:questions.length,pct,time,date:Date.now()});
    navigate('result');
  };
  const allAnswered=answers.every(a=>a!==null);
  const labels=['ก.','ข.','ค.','ง.'];
  return(
    <div className="animate-fadeIn min-h-screen dot-bg">
      <div className="glass sticky top-0 z-40 border-b border-gray-200/50 dark:border-gray-700/50">
        <div className="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between">
          <button onClick={()=>navigate('subject',subjectId)} className="text-sm text-gray-400 hover:text-gray-600">← ออก</button>
          <div className="text-center">
            <div className={`text-xs font-bold ${c.text}`}>{s?.icon} {s?.name}</div>
          </div>
          <Timer startTime={startTime}/>
        </div>
        <div className="max-w-3xl mx-auto px-4 pb-2"><PBar value={idx+1} max={questions.length} color={s?.color||'indigo'}/></div>
      </div>
      <div className="max-w-3xl mx-auto px-4 py-6">
        <div className="flex items-center justify-between mb-2">
          <div className="flex flex-wrap gap-1">
            {questions.map((_,i)=>(
              <button key={i} onClick={()=>{setShowExplain(false);setIdx(i);}}
                className={`w-7 h-7 rounded-lg text-xs font-bold transition-all ${i===idx?`bg-gradient-to-r ${c.grad} text-white scale-110 shadow`:answers[i]!==null?'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500':'bg-gray-100 dark:bg-gray-800 text-gray-400'} ${bookmarks.includes(i)?'ring-2 ring-amber-400':''}`}>
                {i+1}
              </button>
            ))}
          </div>
        </div>
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-5 mb-4 border border-gray-100 dark:border-gray-800 animate-slideUp" key={idx}>
          <div className="flex items-start justify-between mb-3">
            <div className="flex items-start gap-3">
              <span className={`inline-flex items-center justify-center w-9 h-9 rounded-xl ${c.light} ${c.text} font-bold shrink-0`}>{idx+1}</span>
              <div>
                {q.topic&&<span className="text-xs text-gray-400 block mb-1">📎 {q.topic} · {q.difficulty==='easy'?'ง่าย':q.difficulty==='medium'?'ปานกลาง':'ยาก'}</span>}
                <h2 className="text-base font-semibold text-gray-800 dark:text-gray-100 leading-relaxed">{q.question}</h2>
              </div>
            </div>
            <button onClick={toggleBM} className="text-xl shrink-0 ml-2" title="Bookmark">{bookmarks.includes(idx)?'🔖':'📌'}</button>
          </div>
        </div>
        <div className="space-y-2 mb-6">
          {q.displayChoices.map((ch,ci)=>{
            let cls='bg-white dark:bg-gray-900 border-2 border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:shadow-md';
            if(answered){
              if(ci===q.correctIndex)cls='bg-emerald-50 dark:bg-emerald-900/20 border-2 border-emerald-400 ring-2 ring-emerald-400 shadow-md';
              else if(ci===answers[idx])cls='bg-rose-50 dark:bg-rose-900/20 border-2 border-rose-400 ring-2 ring-rose-400';
              else cls='bg-gray-50 dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-700 opacity-50';
            }
            return(
              <button key={ci} onClick={()=>selectAnswer(ci)} disabled={answered}
                className={`opt-btn w-full text-left p-3.5 rounded-xl flex items-start gap-3 transition-all ${cls}`}>
                <span className={`inline-flex items-center justify-center w-7 h-7 rounded-lg text-xs font-bold shrink-0 ${answered&&ci===q.correctIndex?'bg-emerald-500 text-white':answered&&ci===answers[idx]?'bg-rose-400 text-white':'bg-gray-100 dark:bg-gray-700 text-gray-500'}`}>{labels[ci]}</span>
                <span className="text-sm pt-0.5 flex-1">{ch}</span>
                {answered&&ci===q.correctIndex&&<span className="text-emerald-500 ml-auto">✓</span>}
                {answered&&ci===answers[idx]&&ci!==q.correctIndex&&<span className="text-rose-400 ml-auto">✗</span>}
              </button>
            );
          })}
        </div>
        {answered&&(
          <button onClick={()=>setShowExplain(true)} className="w-full py-2.5 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-400 font-medium text-sm hover:bg-amber-100 dark:hover:bg-amber-900/40 transition-all mb-4">
            💡 ดูเฉลยละเอียด
          </button>
        )}
        <div className="flex gap-3">
          <button onClick={goPrev} disabled={idx===0} className="flex-1 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 font-medium text-sm disabled:opacity-30 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">← ข้อก่อนหน้า</button>
          {idx===questions.length-1?(
            <button onClick={submit} disabled={!allAnswered} className={`flex-1 py-2.5 rounded-xl font-bold text-sm text-white transition-all active:scale-95 ${allAnswered?`bg-gradient-to-r ${c.grad} hover:shadow-lg`:'bg-gray-300 dark:bg-gray-700'}`}>
              📤 ส่งคำตอบ ({answers.filter(a=>a!==null).length}/{questions.length})
            </button>
          ):(
            <button onClick={goNext} className={`flex-1 py-2.5 rounded-xl bg-gradient-to-r ${c.grad} text-white font-medium text-sm hover:shadow-lg transition-all active:scale-95`}>ข้อถัดไป →</button>
          )}
        </div>
      </div>
      <Modal show={showExplain} onClose={()=>setShowExplain(false)} wide>
        <div className={`px-5 py-4 rounded-t-2xl ${isCorrect?'bg-emerald-50 dark:bg-emerald-900/20':'bg-rose-50 dark:bg-rose-900/20'}`}>
          <div className="flex items-center gap-2">
            <span className="text-2xl">{isCorrect?'🎉':'💡'}</span>
            <div>
              <h3 className={`font-bold ${isCorrect?'text-emerald-700 dark:text-emerald-400':'text-rose-700 dark:text-rose-400'}`}>{isCorrect?'ถูกต้อง!':'ยังไม่ถูก'}</h3>
              {!isCorrect&&<p className="text-xs text-rose-500">คำตอบที่ถูก: {labels[q.correctIndex]} {q.displayChoices[q.correctIndex]}</p>}
            </div>
          </div>
        </div>
        <div className="px-5 py-4">
          {q.solution&&<><h4 className="text-xs font-bold text-gray-400 uppercase mb-2">📝 วิธีทำ</h4><div className="bg-gray-50 dark:bg-gray-800 rounded-xl p-3 text-sm leading-relaxed whitespace-pre-line mb-3">{q.solution}</div></>}
          {q.explanation&&<><h4 className="text-xs font-bold text-gray-400 uppercase mb-2">💡 อธิบาย</h4><div className="bg-gray-50 dark:bg-gray-800 rounded-xl p-3 text-sm leading-relaxed whitespace-pre-line mb-3">{q.explanation}</div></>}
          {q.formula&&<div className="bg-amber-50 dark:bg-amber-900/20 rounded-xl p-3 border border-amber-200 dark:border-amber-800"><h4 className="text-xs font-bold text-amber-600 mb-1">📐 สูตร</h4><div className="text-sm font-mono text-amber-800 dark:text-amber-300">{q.formula}</div></div>}
        </div>
      </Modal>
    </div>
  );
}

// RESULT PAGE
// ═══════════════════════════════════════════
function ResultPage(){
  const{result,navigate}=useApp();
  if(!result)return <div className="max-w-6xl mx-auto px-4 py-20 text-center text-gray-400"><p>ไม่มีผลสอบ</p><button onClick={()=>navigate('home')} className="mt-4 text-indigo-500">กลับหน้าหลัก</button></div>;
  const{subjectId,score,total,pct,time,details}=result;
  const s=SUBJECTS.find(x=>x.id===subjectId);
  const c=s?COLOR_MAP[s.color]:COLOR_MAP.rose;
  let grade,emoji,msg;
  if(pct>=80){grade='A';emoji='🏆';msg='ยอดเยี่ยม! พร้อมสอบจริงแล้ว!';}
  else if(pct>=60){grade='B';emoji='💪';msg='ดีมาก! ทบทวนข้อที่ผิดอีกนิดจะเต็มร้อย';}
  else if(pct>=40){grade='C';emoji='📚';msg='พอใช้ ลองอ่านเนื้อหาเพิ่มแล้วทำใหม่';}
  else{grade='D';emoji='🔥';msg='สู้ๆ! กลับไปอ่าน Cheat Sheet แล้วลองอีกครั้ง';}
  const topicStats={};
  details.forEach(d=>{
    const t=d.topic||'ทั่วไป';
    if(!topicStats[t])topicStats[t]={correct:0,total:0};
    topicStats[t].total++;if(d.correct)topicStats[t].correct++;
  });
  const weakTopics=Object.entries(topicStats).filter(([_,v])=>v.correct/v.total<0.6).map(([k])=>k);
  return(
    <div className="animate-fadeIn max-w-2xl mx-auto px-4 py-8">
      <Confetti show={pct>=80}/>
      <div className="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
        <div className={`bg-gradient-to-r ${c.grad} p-8 text-center text-white`}>
          <div className="text-5xl mb-3 animate-pop">{emoji}</div>
          <h1 className="font-display text-3xl font-black mb-1">สรุปคะแนน</h1>
          <p className="opacity-80 text-sm">{s?.icon} {s?.name}</p>
        </div>
        <div className="p-6">
          <div className="flex justify-center mb-6">
            <div className={`w-32 h-32 rounded-full bg-gradient-to-br ${c.grad} flex items-center justify-center text-white shadow-lg`}>
              <div className="text-center"><div className="font-display text-4xl font-black">{score}</div><div className="text-xs opacity-80">/ {total}</div></div>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="bg-emerald-50 dark:bg-emerald-900/20 rounded-xl p-3 text-center"><div className="text-2xl font-black text-emerald-600">{score}</div><div className="text-xs text-emerald-400">ถูก</div></div>
            <div className="bg-rose-50 dark:bg-rose-900/20 rounded-xl p-3 text-center"><div className="text-2xl font-black text-rose-500">{total-score}</div><div className="text-xs text-rose-400">ผิด</div></div>
            <div className="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-3 text-center"><div className="text-2xl font-black text-blue-600">{fmtTime(time)}</div><div className="text-xs text-blue-400">เวลา</div></div>
          </div>
          <div className="bg-gray-50 dark:bg-gray-800 rounded-xl p-4 mb-4 text-center">
            <span className="text-sm text-gray-500">เกรด </span><span className="text-xl font-black text-indigo-600 dark:text-indigo-400">{grade}</span>
            <span className="text-sm text-gray-500 ml-3">{pct}%</span>
            <p className="text-sm text-gray-400 mt-1">{msg}</p>
          </div>
          {weakTopics.length>0&&(
            <div className="bg-amber-50 dark:bg-amber-900/20 rounded-xl p-4 border border-amber-200 dark:border-amber-800 mb-4">
              <h4 className="text-sm font-bold text-amber-700 dark:text-amber-400 mb-2">⚠️ หัวข้อที่ควรทบทวน</h4>
              <ul className="text-sm text-amber-600 dark:text-amber-300 space-y-1">{weakTopics.map((t,i)=><li key={i}>• {t}</li>)}</ul>
              <button onClick={()=>navigate('cheatsheet',subjectId)} className="mt-2 text-xs text-amber-500 underline">📖 ไปดู Cheat Sheet</button>
            </div>
          )}
          <div className="bg-gray-50 dark:bg-gray-800 rounded-xl p-4 mb-4">
            <h4 className="text-sm font-bold text-gray-500 mb-2">📊 คะแนนรายหัวข้อ</h4>
            {Object.entries(topicStats).map(([topic,stat])=>(
              <div key={topic} className="flex items-center gap-2 text-sm py-1">
                <span className="flex-1 truncate">{topic}</span>
                <span className={`font-bold ${stat.correct/stat.total>=0.8?'text-emerald-500':stat.correct/stat.total>=0.5?'text-amber-500':'text-rose-500'}`}>{stat.correct}/{stat.total}</span>
              </div>
            ))}
          </div>
          <div className="flex gap-3">
            <button onClick={()=>navigate('review')} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">📋 ดูรีวิวข้อสอบ</button>
            <button onClick={()=>navigate('subject',subjectId)} className={`flex-1 py-3 rounded-xl bg-gradient-to-r ${c.grad} text-white font-bold hover:shadow-lg transition-all active:scale-95`}>🔄 ทำใหม่</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// REVIEW PAGE

    <div className="animate-fadeIn max-w-3xl mx-auto px-4 py-8">
      <button onClick={()=>navigate('result')} className="text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 mb-4 inline-block">← กลับผลสอบ</button>
      <h1 className="text-2xl font-bold mb-4 flex items-center gap-2">📋 รีวิวข้อสอบ — {s?.name}</h1>
      <div className="flex gap-2 mb-6">
        {[['all','ทั้งหมด'],['wrong','❌ ข้อผิด'],['correct','✅ ข้อถูก']].map(([k,lb])=>(
          <button key={k} onClick={()=>setFilter(k)} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${filter===k?'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400':'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}>{lb} ({k==='all'?details.length:k==='wrong'?details.filter(d=>!d.correct).length:details.filter(d=>d.correct).length})</button>
        ))}
      </div>
      <div className="space-y-3">
        {filtered.map((d,i)=>{
          const origIdx=details.indexOf(d);
          const expanded=expandedIdx===origIdx;
          return(
            <div key={origIdx} className={`bg-white dark:bg-gray-900 rounded-xl border ${d.correct?'border-emerald-200 dark:border-emerald-800':'border-rose-200 dark:border-rose-800'} overflow-hidden`}>
              <button onClick={()=>setExpandedIdx(expanded?null:origIdx)} className="w-full text-left p-4 flex items-start gap-3">
                <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${d.correct?'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600':'bg-rose-100 dark:bg-rose-900/30 text-rose-500'}`}>{origIdx+1}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium truncate">{d.question}</p>
                  <p className="text-xs text-gray-400 mt-0.5">📎 {d.topic}</p>
                </div>
                <span className="text-lg shrink-0">{d.correct?'✅':'❌'}</span>
              </button>
              {expanded&&(
                <div className="px-4 pb-4 animate-slideUp">
                  <div className="space-y-1.5 mb-3">
                    {d.choices.map((ch,ci)=>(
                      <div key={ci} className={`text-sm p-2 rounded-lg flex items-center gap-2 ${ci===d.correctAnswer?'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 font-medium':ci===d.userAnswer?'bg-rose-50 dark:bg-rose-900/20 text-rose-600':'text-gray-500'}`}>
                        <span className="font-bold text-xs w-5">{labels[ci]}</span>{ch}
                        {ci===d.correctAnswer&&<span className="ml-auto text-xs">✓ ถูก</span>}
                        {ci===d.userAnswer&&ci!==d.correctAnswer&&<span className="ml-auto text-xs">✗ ตอบ</span>}
                      </div>
                    ))}
                  </div>
                  {d.solution&&<div className="bg-gray-50 dark:bg-gray-800 rounded-xl p-3 text-sm whitespace-pre-line mb-2"><span className="font-bold text-gray-500">📝 วิธีทำ:</span><br/>{d.solution}</div>}
                  {d.explanation&&<div className="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-3 text-sm whitespace-pre-line"><span className="font-bold text-blue-500">💡 อธิบาย:</span><br/>{d.explanation}</div>}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="mt-6 flex gap-3">
        <button onClick={()=>navigate('home')} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">🏠 หน้าหลัก</button>
        <button onClick={()=>navigate('subject',subjectId)} className="flex-1 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold hover:shadow-lg transition-all">🔄 ทำใหม่</button>
      </div>
    </div>
  );
}

// SETTINGS PAGE
// ═══════════════════════════════════════════
function SettingsPage(){
  const{dark,setDark,clearData,history}=useApp();
  const[showConfirm,setShowConfirm]=useState(false);
  return(
    <div className="animate-fadeIn max-w-2xl mx-auto px-4 py-8">
      <h1 className="text-2xl font-bold mb-6 flex items-center gap-2">⚙️ ตั้งค่า</h1>
      <div className="space-y-4">
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow p-5 border border-gray-100 dark:border-gray-800">
          <div className="flex items-center justify-between">
            <div><h3 className="font-bold">🌙 Dark Mode</h3><p className="text-sm text-gray-400">สลับธีมสว่าง/มืด</p></div>
            <button onClick={setDark} className={`w-14 h-7 rounded-full relative transition-colors ${dark?'bg-indigo-500':'bg-gray-300'}`}>
              <div className={`absolute top-0.5 w-6 h-6 rounded-full bg-white shadow transition-transform ${dark?'translate-x-7':'translate-x-0.5'}`}/>
            </button>
          </div>
        </div>
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow p-5 border border-gray-100 dark:border-gray-800">
          <h3 className="font-bold mb-1">📊 สถิติ</h3>
          <p className="text-sm text-gray-400 mb-3">ทำข้อสอบไปแล้ว {history.length} ครั้ง</p>
          {!showConfirm?(
            <button onClick={()=>setShowConfirm(true)} className="px-4 py-2 rounded-xl bg-rose-100 dark:bg-rose-900/20 text-rose-600 text-sm font-medium hover:bg-rose-200 dark:hover:bg-rose-900/40 transition-all">🗑 ล้างข้อมูลทั้งหมด</button>
          ):(
            <div className="flex gap-2">
              <button onClick={()=>{clearData();setShowConfirm(false);}} className="px-4 py-2 rounded-xl bg-rose-500 text-white text-sm font-bold">ยืนยันลบ</button>
              <button onClick={()=>setShowConfirm(false)} className="px-4 py-2 rounded-xl bg-gray-200 dark:bg-gray-700 text-sm font-medium">ยกเลิก</button>
            </div>
          )}
        </div>
        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow p-5 border border-gray-100 dark:border-gray-800">
          <h3 className="font-bold mb-1">ℹ️ เกี่ยวกับ</h3>
          <p className="text-sm text-gray-400">Midterm Survival ม.4 เทอม 1</p>
          <p className="text-sm text-gray-400">เว็บติวสอบกลางภาค ครบ 6 วิชา 165 ข้อ</p>
          <p className="text-sm text-gray-400 mt-1">สร้างด้วย React + TailwindCSS + Chart.js</p>
          <p className="text-xs text-gray-300 dark:text-gray-600 mt-2">© 2568 — สร้างเพื่อการศึกษา</p>
        </div>
      </div>
    </div>
  );
}

function App(){
  const{page}=useApp();
  const pages={home:HomePage,dashboard:DashboardPage,subject:SubjectPage,cheatsheet:CheatSheetPage,quiz:QuizPage,result:ResultPage,review:ReviewPage,settings:SettingsPage};
  const Page=pages[page.name]||HomePage;
  return(
    <div className="min-h-screen flex flex-col">
      {page.name!=='quiz'&&<Navbar/>}

        <footer className="text-center py-4 text-xs text-gray-300 dark:text-gray-600 border-t border-gray-100 dark:border-gray-800">
          Midterm Survival © 2568 — สร้างเพื่อการเรียนรู้
        </footer>
      )}
    </div>
  );
}
